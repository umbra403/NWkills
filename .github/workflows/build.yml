name: build-windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name nwkills --add-data "nwkills/data;nwkills/data" nwkills.py
      - name: Smoke test
        run: dist\nwkills.exe --help
      - uses: actions/upload-artifact@v4
        with: { name: nwkills-windows, path: dist/nwkills.exe }
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nwkills.exe
          generate_release_notes: true
