name: build-windows
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install pyinstaller pyside6 pytest
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Version resources (one version number, one product name, for every build)
        run: |
          python packaging/make_version_info.py version_cli.txt --exe nwkills
          python packaging/make_version_info.py version_gui.txt --exe nwkills-gui
      - name: Tag must match the version in nwkills/__init__.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/make_version_info.py --check-tag ${{ github.ref_name }}
      - name: Window self-test (builds the tables offscreen and checks sorting, filters and copy)
        run: python nwkills_gui.py --selftest
      - run: pyinstaller --onefile --noupx --version-file version_cli.txt --name nwkills --add-data "nwkills/data;nwkills/data" nwkills.py
      - name: Smoke test (command line)
        run: dist\nwkills.exe --help
      - run: pyinstaller --onefile --noupx --version-file version_gui.txt --windowed --name nwkills-gui --add-data "nwkills/data;nwkills/data" nwkills_gui.py
      - name: Smoke test (window)
        run: dist\nwkills-gui.exe --selftest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Checksums
        shell: pwsh
        run: Get-FileHash dist\nwkills.exe, dist\nwkills-gui.exe -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: nwkills-windows
          path: |
            dist/nwkills.exe
            dist/nwkills-gui.exe
            dist/SHA256SUMS.txt
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nwkills.exe
            dist/nwkills-gui.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
